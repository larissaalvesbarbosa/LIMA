<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS_Interno</title>
    <!--  Declaração do CSS interno  -->
    <style>
        h1{
            color: red;
            text-align: center;
            font-size: 72px;
        }
        h2{
            color: blue;
            text-align: center;
            font-size: 72px;
        }
        p{
            font-size: 42px;
            text-align: center;
        }
        .fonte{
            color: blue;
        }
    </style>

</head>

<body>
<h1> Larissa Alves Barbosa</h1>
<p> Estudante de Desenvolvimento de Sistemas</p>
<p> Lista de Cusos</p>
<h2 class="fonte"> Lista de cursos Transversais</h2>
</body>

</html>
