<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS_Interno</title>
    
    <style>
        h1 {
            color: rgb(231, 171, 50); 
            text-align: center;
            font-size: 40px;
            margin-left: 25%;
            margin-right: 25%;
        }
        
        h2 {
            color: black;
            text-align: center;
            font-size: 40px;
        }

        p {
            font-size: 42px;
            text-align: center;
        }

        .fonte {
            color: black;
        }

        /* Dica: Aplique o :hover em elementos específicos, como .fonte:hover */
        .fonte:hover {
            color: rgb(211, 183, 0);
            font-size: 45px;
        }

        /* Regra base para todas as imagens (efeito de transição) */
        img {
            transition: transform 0.3s ease; /* Deixa o efeito :hover suave */
            object-fit: cover; /* Evita que a imagem fique distorcida */
        }

        /* Estilos de tamanho individual */
        .img-pequena {
            width: 150px;
            height: 150px;
        }

        .img-media {
            width: 300px;
            height: 300px;
        }

        .img-grande {
            width: 450px;
            height: 450px;
        }

        
        img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body style="background-color:rgb(112, 80, 24)">
    <h1>lahcstr</h1>
    <h2 class="fonte">pins</h2>

    <!-- Imagem com tamanho Médio -->
    <img class="img-media" src="https://i.pinimg.com/736x/06/ea/df/06eadf81233d81466f478c45682dfe07.jpg" alt="Pin 1">

    
    <img class="img-pequena" src="https://i.pinimg.com/736x/db/c6/0a/dbc60a1622d2222b6a2e70c5050e42ca.jpg" alt="Pin 2">
</body>

</html>
